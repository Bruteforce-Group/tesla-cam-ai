name: Deploy Tesla Cam AI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ENDPOINT_HOST: 192.168.222.60
  ENDPOINT_USER: danielborrowman
  DEPLOY_PATH: /opt/tesla-cam-ai

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci

      - name: Install RPi dependencies
        working-directory: rpi5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint JavaScript
        working-directory: workers
        run: npm run lint || true

      - name: Lint Python
        working-directory: rpi5
        run: |
          pip install pylint
          pylint main.py || true

  deploy-workers:
    name: Deploy Cloudflare Workers
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        working-directory: workers
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

      - name: Run database migrations
        if: github.ref == 'refs/heads/main'
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute tesla-cam-db --file=../migrations/schema.sql || echo "Migrations may have already run"

  deploy-dashboard:
    name: Deploy Dashboard to Pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=tesla-cam-dashboard

  deploy-endpoint:
    name: Deploy to Raspberry Pi Endpoint
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $ENDPOINT_HOST >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no $ENDPOINT_USER@$ENDPOINT_HOST "echo 'SSH connection successful'"

      - name: Create deployment package
        run: |
          tar -czf deployment.tar.gz \
            rpi5/ \
            --exclude=rpi5/__pycache__ \
            --exclude=rpi5/*.pyc \
            --exclude=rpi5/.pytest_cache

      - name: Upload deployment package
        run: |
          scp deployment.tar.gz $ENDPOINT_USER@$ENDPOINT_HOST:/tmp/

      - name: Deploy to endpoint
        run: |
          ssh $ENDPOINT_USER@$ENDPOINT_HOST << 'ENDSSH'
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Create backup of current version
            if [ -d "${{ env.DEPLOY_PATH }}" ]; then
              echo "📦 Creating backup..."
              sudo cp -r ${{ env.DEPLOY_PATH }} ${{ env.DEPLOY_PATH }}.backup.$(date +%Y%m%d_%H%M%S)
            fi
            
            # Extract new version
            echo "📥 Extracting new version..."
            sudo mkdir -p ${{ env.DEPLOY_PATH }}
            sudo tar -xzf /tmp/deployment.tar.gz -C ${{ env.DEPLOY_PATH }} --strip-components=1
            sudo chown -R $ENDPOINT_USER:$ENDPOINT_USER ${{ env.DEPLOY_PATH }}
            
            # Update dependencies
            echo "📚 Updating dependencies..."
            cd ${{ env.DEPLOY_PATH }}
            python3 -m venv venv || true
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Update configuration if needed
            if [ ! -f /etc/tesla-cam-ai/config.json ]; then
              echo "⚙️  Creating default config..."
              sudo mkdir -p /etc/tesla-cam-ai
              sudo cp config/config.example.json /etc/tesla-cam-ai/config.json
              echo "⚠️  Please update /etc/tesla-cam-ai/config.json with your credentials"
            fi
            
            # Restart services
            echo "🔄 Restarting services..."
            sudo systemctl daemon-reload
            sudo systemctl restart tesla-cam-ai.service || echo "Service not yet installed"
            sudo systemctl restart tesla-cam-upload.service || echo "Upload service not yet installed"
            
            # Check service status
            echo "✅ Checking service status..."
            sudo systemctl status tesla-cam-ai.service --no-pager || true
            
            # Cleanup
            rm /tmp/deployment.tar.gz
            
            echo "✨ Deployment complete!"
            echo "📊 Service logs: sudo journalctl -u tesla-cam-ai -f"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh $ENDPOINT_USER@$ENDPOINT_HOST << 'ENDSSH'
            if systemctl is-active --quiet tesla-cam-ai.service; then
              echo "✅ Service is running"
              exit 0
            else
              echo "❌ Service is not running"
              exit 1
            fi
          ENDSSH

      - name: Rollback on failure
        if: failure()
        run: |
          ssh $ENDPOINT_USER@$ENDPOINT_HOST << 'ENDSSH'
            echo "🔙 Rolling back to previous version..."
            LATEST_BACKUP=$(ls -t ${{ env.DEPLOY_PATH }}.backup.* 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              sudo rm -rf ${{ env.DEPLOY_PATH }}
              sudo mv "$LATEST_BACKUP" ${{ env.DEPLOY_PATH }}
              sudo systemctl restart tesla-cam-ai.service
              echo "✅ Rollback complete"
            else
              echo "⚠️  No backup found"
            fi
          ENDSSH

  notify:
    name: Send Notifications
    needs: [deploy-workers, deploy-dashboard, deploy-endpoint]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-workers.result }}" == "success" ] && \
             [ "${{ needs.deploy-dashboard.result }}" == "success" ] && \
             [ "${{ needs.deploy-endpoint.result }}" == "success" ]; then
            echo "STATUS=success" >> $GITHUB_ENV
            echo "MESSAGE=✅ All deployments successful!" >> $GITHUB_ENV
          else
            echo "STATUS=failure" >> $GITHUB_ENV
            echo "MESSAGE=❌ Some deployments failed" >> $GITHUB_ENV
          fi

      - name: Send Slack notification
        if: env.STATUS == 'success' || env.STATUS == 'failure'
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        with:
          payload: |
            {
              "text": "${{ env.MESSAGE }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Tesla Cam AI Deployment*\n${{ env.MESSAGE }}\n\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

name = "tesla-cam-ai"
main = "api/index.js"
compatibility_date = "2024-01-01"

# Account details
account_id = "0b0ee2b5eaf1fb8a2612e40ab6488052"

# KV Namespaces
kv_namespaces = [
  { binding = "DEVICE_STATUS", id = "011fb094f2eb4ee6b3212ef05da9d857" }
]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tesla-cam-db"
database_id = "09f4ad01-e5b5-4625-b1bf-160c644c54d6"

# R2 Buckets
[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "tesla-cam-archive"

# Queues
[[queues.producers]]
binding = "AI_QUEUE"
queue = "ai-processing"

[[queues.consumers]]
queue = "ai-processing"
max_batch_size = 10
max_batch_timeout = 30

# Durable Objects
[[durable_objects.bindings]]
name = "EVENT_PROCESSOR"
class_name = "TeslaEventProcessor"

[[durable_objects.bindings]]
name = "ALERT_MANAGER"
class_name = "AlertManager"

[[migrations]]
tag = "v1"
new_classes = ["TeslaEventProcessor", "AlertManager"]

# AI Binding
[ai]
binding = "AI"

# Environment Variables
[vars]
STREAM_ACCOUNT_ID = "0b0ee2b5eaf1fb8a2612e40ab6488052"
STREAM_API_TOKEN = "aoxPLKNqW086yxsa_PHEs_sbsHZ8dlrzomnxQN7z"
WORKER_API_KEY = "KqwfqrQ4x0IOSmVp/pHn/vsgeku/jCUEeg0vzaCHU1w="
MAILGUN_API_KEY = "YOUR_MAILGUN_API_KEY"
ENVIRONMENT = "production"

# Routes (uncomment and configure when you have a custom domain)
# [[routes]]
# pattern = "tesla-cam-api.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Development overrides
[env.development]
vars = { ENVIRONMENT = "development" }
